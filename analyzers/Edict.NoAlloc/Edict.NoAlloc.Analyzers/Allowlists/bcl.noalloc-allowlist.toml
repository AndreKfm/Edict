# Baseline allowlist shipped with the analyzer: runtime library members assumed to satisfy every constraint
# (no allocation, lock, blocking, async, explicit throw for valid arguments, reflection or type initialization).
# Entries a target framework lacks are skipped silently for this file only; BaselineAllowlistTests checks that
# every entry resolves on the test runtime. Format: analyzers/Edict.NoAlloc/README.md, section Allowlist.

# Object, arrays, strings
[[member]]
